<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" width="48" height="48">
  <defs>
    <linearGradient id="ingpt-fav-grad1" x1="6" y1="12" x2="42" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8DA8DE" />
      <stop offset="45%" stop-color="#A9C4F5" />
      <stop offset="75%" stop-color="#D4CCE8" />
      <stop offset="100%" stop-color="#8DA8DE" />
    </linearGradient>
    <linearGradient id="ingpt-fav-grad2" x1="12" y1="36" x2="36" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F4F7FC" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#8DA8DE" stop-opacity="0.3" />
    </linearGradient>
    <filter id="ingpt-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background pill/circle soft plate -->
  <rect x="2" y="2" width="44" height="44" rx="14" fill="#F4F4F2" />
  
  <!-- Continuous infinity-wave orbit -->
  <path 
    d="M14 24 C14 18 19 14 24 24 C29 34 34 30 34 24 C34 18 29 14 24 24 C19 34 14 30 14 24 Z" 
    stroke="url(#ingpt-fav-grad1)" 
    stroke-width="3.5" 
    stroke-linecap="round" 
    stroke-linejoin="round"
    filter="url(#ingpt-glow)"
  />
  
  <!-- Shimmering orbital center accent -->
  <circle cx="24" cy="24" r="2.5" fill="#EDF2FB" />
  <circle cx="16" cy="21" r="1.5" fill="#A9C4F5" opacity="0.8" />
  <circle cx="32" cy="27" r="1.5" fill="#D4CCE8" opacity="0.8" />
</svg>
